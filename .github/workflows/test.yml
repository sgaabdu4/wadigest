name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: { node-version: '22' }
      - run: for f in scripts/install.sh get.sh wacli-fork/build.sh scripts/uninstall.sh scripts/package.sh; do bash -n "$f"; done
      - run: npm test
